name: Build RIPPED APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build RIPPED.apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK with AutoBuild.BuildAndroid
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: AutoBuild.BuildAndroid
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RIPPED-apk
          path: build/Android/RIPPED.apk
          if-no-files-found: warn
          retention-days: 14
